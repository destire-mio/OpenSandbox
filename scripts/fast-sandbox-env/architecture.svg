<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="952" viewBox="0 0 1560 952" font-family="-apple-system,'Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#1d4ed8"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#16a34a"/></marker>
    <marker id="ap" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#9333ea"/></marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#ea580c"/></marker>
  </defs>
  <style>
    .t-title{font-size:25px;font-weight:700;fill:#0f172a}
    .t-sub{font-size:12.5px;fill:#475569}
    .t-box{font-size:13px;font-weight:700;fill:#0f172a}
    .t-body{font-size:11px;fill:#334155}
    .t-small{font-size:9.8px;fill:#64748b}
    .t-chip{font-size:11px;font-weight:600;fill:#0c4a6e}
    .t-osb{font-size:13px;font-weight:700;fill:#0f766e}
  </style>

  <rect width="1560" height="952" fill="#f8fafc"/>
  <text x="40" y="42" class="t-title">fast-sandbox integration environment — deployment view</text>
  <text x="40" y="64" class="t-sub">scripts/fast-sandbox-env · up = full stack: fast-sandbox@master on kind (KVM) + OpenSandbox server / ingress / egress (source-built) · verified end to end on every up</text>

  <!-- ================= host ================= -->
  <rect x="40" y="88" width="1480" height="842" rx="14" fill="#f1f5f9" stroke="#334155" stroke-width="2.5"/>
  <text x="60" y="112" class="t-small">Linux KVM host (bare metal) · /dev/kvm · XFS StateRoot (reflink) · docker daemon</text>

  <!-- legend -->
  <g>
    <line x1="460" y1="116" x2="496" y2="116" stroke="#1d4ed8" stroke-width="2.5"/><text x="502" y="120" class="t-small">control</text>
    <line x1="600" y1="116" x2="636" y2="116" stroke="#16a34a" stroke-width="2.5"/><text x="642" y="120" class="t-small">data</text>
    <line x1="716" y1="116" x2="752" y2="116" stroke="#9333ea" stroke-width="2.5" stroke-dasharray="6 3"/><text x="758" y="120" class="t-small">P2P / artifacts</text>
    <line x1="886" y1="116" x2="922" y2="116" stroke="#ea580c" stroke-width="2.5" marker-start="url(#ao)" marker-end="url(#ao)"/><text x="930" y="120" class="t-small">loopback actions</text>
  </g>

  <!-- client + MinIO -->
  <rect x="120" y="130" width="300" height="84" rx="8" fill="#ffffff" stroke="#475569"/>
  <text x="134" y="152" class="t-box">Client / SDK / up-verify</text>
  <text x="134" y="170" class="t-body">:8080 lifecycle API (api key header)</text>
  <text x="134" y="186" class="t-body">:8081 gateway routes (f1.*)</text>
  <text x="134" y="204" class="t-small">runs on the host</text>

  <rect x="1210" y="130" width="280" height="84" rx="8" fill="#fefce8" stroke="#ca8a04"/>
  <text x="1224" y="152" class="t-box" fill="#713f12">MinIO (docker, kind network)</text>
  <text x="1224" y="170" class="t-body">bucket sandbox-images</text>
  <text x="1224" y="186" class="t-body">golden snapshot set (origin)</text>

  <!-- ================= kind cluster ================= -->
  <rect x="70" y="240" width="1420" height="616" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="86" y="262" class="t-box">kind cluster fast-sandbox-integration (2 nodes, KVM passthrough)</text>

  <!-- ns opensandbox-system -->
  <rect x="100" y="270" width="1360" height="130" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-dasharray="7 4"/>
  <text x="112" y="288" class="t-small" fill="#0f766e">ns opensandbox-system · manifests/opensandbox/</text>

  <rect x="120" y="300" width="520" height="80" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="134" y="322" class="t-osb">OpenSandbox server (source-built)</text>
  <text x="134" y="340" class="t-body">runtime.type=fleets · create/get via FastPath gRPC</text>
  <text x="134" y="356" class="t-body">signs f1.* gateway routes (shared key 'a')</text>
  <text x="134" y="373" class="t-small">Service NodePort 30880 → host 127.0.0.1:8080</text>

  <rect x="700" y="300" width="520" height="80" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.8"/>
  <text x="714" y="322" class="t-osb">OpenSandbox ingress gateway (source-built)</text>
  <text x="714" y="340" class="t-body">--provider-type=fleets · ResolveEndpoint</text>
  <text x="714" y="356" class="t-body">verifies f1.* scopes · proxies to fastlet-proxy</text>
  <text x="714" y="373" class="t-small">Service NodePort 30881 → host 127.0.0.1:8081</text>

  <!-- ns fast-sandbox-system -->
  <rect x="100" y="420" width="1360" height="70" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-dasharray="7 4"/>
  <rect x="240" y="428" width="540" height="54" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="254" y="449" class="t-box">fast-sandbox all-in-one — controller + FastPath :9090</text>
  <text x="254" y="468" class="t-small">ns fast-sandbox-system · CRDs sandboxes/sandboxpools/sandboxtemplates · pool firecracker-egress-pool</text>

  <!-- ================= node A ================= -->
  <rect x="100" y="510" width="680" height="336" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="100" y="510" width="680" height="36" rx="10" fill="#dbeafe"/>
  <text x="116" y="532" class="t-box">kind node A (control-plane)</text>

  <rect x="420" y="556" width="320" height="64" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="434" y="577" class="t-box" fill="#6b21a8">runtime-agent + DART</text>
  <text x="434" y="594" class="t-body">peer :9000 · metrics :8147</text>
  <text x="434" y="610" class="t-small">snapshot cache per node</text>

  <rect x="120" y="628" width="640" height="100" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="132" y="646" class="t-box" fill="#155e75">fastlet Pod (pool-managed · one per node)</text>
  <rect x="132" y="654" width="300" height="62" rx="6" fill="#cffafe" stroke="#06b6d4"/>
  <text x="144" y="674" class="t-box">fastlet</text>
  <text x="144" y="691" class="t-body">firecracker driver · fastlet-proxy :5780</text>
  <text x="144" y="707" class="t-body">restores microVMs on create</text>
  <rect x="448" y="654" width="300" height="62" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="460" y="674" class="t-box" fill="#9a3412">egress (OpenSandbox)</text>
  <text x="460" y="691" class="t-body">fleet · dns+nft · NET_ADMIN</text>
  <text x="460" y="707" class="t-body">per-sandbox network policy</text>
  <line x1="434" y1="685" x2="446" y2="685" stroke="#ea580c" stroke-width="2" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <text x="440" y="726" class="t-small" text-anchor="middle">actions 127.0.0.1:18080</text>

  <rect x="120" y="740" width="640" height="56" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="132" y="762" class="t-box" fill="#713f12">firecracker microVM (golden snapshot restore)</text>
  <text x="132" y="780" class="t-body">execd :44772 · guest 172.30.0.3</text>
  <line x1="440" y1="728" x2="440" y2="740" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="120" y="822" class="t-small">hostPath /opt/fast-sandbox (firecracker) · /run (agent UDS) · per-node StateRoot</text>

  <!-- ================= node B ================= -->
  <rect x="800" y="510" width="680" height="336" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <rect x="800" y="510" width="680" height="36" rx="10" fill="#dbeafe"/>
  <text x="816" y="532" class="t-box">kind node B (worker)</text>

  <rect x="1120" y="556" width="320" height="64" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="1134" y="577" class="t-box" fill="#6b21a8">runtime-agent + DART</text>
  <text x="1134" y="594" class="t-body">peer :9000 · metrics :8147</text>
  <text x="1134" y="610" class="t-small">first pull served by peer</text>

  <rect x="820" y="628" width="640" height="100" rx="8" fill="#ecfeff" stroke="#0891b2"/>
  <text x="832" y="646" class="t-box" fill="#155e75">fastlet Pod (anti-affinity vs node A)</text>
  <rect x="832" y="654" width="300" height="62" rx="6" fill="#cffafe" stroke="#06b6d4"/>
  <text x="844" y="674" class="t-box">fastlet</text>
  <text x="844" y="691" class="t-body">firecracker driver · fastlet-proxy :5780</text>
  <text x="844" y="707" class="t-body">restores microVMs on create</text>
  <rect x="1148" y="654" width="300" height="62" rx="6" fill="#fff7ed" stroke="#ea580c"/>
  <text x="1160" y="674" class="t-box" fill="#9a3412">egress (OpenSandbox)</text>
  <text x="1160" y="691" class="t-body">fleet · dns+nft · NET_ADMIN</text>
  <text x="1160" y="707" class="t-body">per-sandbox network policy</text>
  <line x1="1134" y1="685" x2="1146" y2="685" stroke="#ea580c" stroke-width="2" marker-start="url(#ao)" marker-end="url(#ao)"/>
  <text x="1140" y="726" class="t-small" text-anchor="middle">actions 127.0.0.1:18080</text>

  <rect x="820" y="740" width="640" height="56" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="832" y="762" class="t-box" fill="#713f12">firecracker microVM (golden snapshot restore)</text>
  <text x="832" y="780" class="t-body">execd :44772 · guest 172.30.0.3</text>
  <line x1="1140" y1="728" x2="1140" y2="740" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="820" y="822" class="t-small">same shape as node A — P2P topology requires both nodes schedulable</text>

  <!-- ================= wires ================= -->
  <!-- client -> server -->
  <line x1="270" y1="214" x2="270" y2="300" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="278" y="244" class="t-small">:8080</text>
  <!-- client -> gateway -->
  <path d="M 420 172 H 960 V 300" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="690" y="164" class="t-small">:8081 · signed f1.* header routes</text>
  <!-- server -> fastpath -->
  <path d="M 380 380 V 414 H 420 V 428" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <!-- gateway -> fastpath -->
  <path d="M 900 380 V 414 H 700 V 428" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="560" y="410" class="t-small" text-anchor="middle">FastPath gRPC :9090</text>
  <!-- fastpath -> fastlet A / B (control) -->
  <path d="M 460 484 V 500 H 390 V 628" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <path d="M 700 484 V 500 H 1060 V 628" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#ab)"/>
  <text x="590" y="497" class="t-small">control</text>
  <!-- gateway -> fastlet-proxy B (data) -->
  <path d="M 790 380 V 660 H 816" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="798" y="395" class="t-small">data: fastlet-proxy :5780</text>
  <!-- DART peer -->
  <line x1="740" y1="588" x2="1120" y2="588" stroke="#9333ea" stroke-width="2" stroke-dasharray="7 4" marker-start="url(#ap)" marker-end="url(#ap)"/>
  <text x="930" y="580" class="t-small" text-anchor="middle" fill="#6b21a8">DART peer :9000 (cache → peer → origin)</text>
  <!-- agent B -> MinIO (origin pull) -->
  <line x1="1380" y1="556" x2="1380" y2="214" stroke="#9333ea" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#ap)"/>
  <text x="1392" y="400" class="t-small" fill="#6b21a8" transform="rotate(-90 1392 400)">golden set pull (S3)</text>

  <!-- ================= footnote ================= -->
  <rect x="70" y="872" width="1420" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="84" y="890" class="t-body">up verify: ① create via server API → ② fastlet restores microVM (first pull via DART P2P) → ③ endpoint 44772 signed f1.* → ④ gateway → fastlet-proxy → execd /ping → ⑤ delete</text>
  <text x="84" y="908" class="t-small">source-built from this repo: server · ingress · egress — execd baked into the golden image (published image) — fast-sandbox control plane @ master</text>
</svg>
